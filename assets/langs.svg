    <rect x="1" y="1" width="478" height="218" rx="15" ry="15" fill="none" stroke="#3d1f5c" stroke-width="1.4"/>
    <text x="24" y="26" font-family="'Segoe UI',Helvetica,sans-serif" font-size="15" font-weight="800" fill="#f5e9ff">Most Used Languages</text>
    
